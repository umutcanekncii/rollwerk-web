<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ROLLWERK · Speisekarte</title>
<link rel="icon" href="../images/RW_Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#161616;--muted:#777;--brand:#c35a38;--line:#e9e9e9;--title:'Barlow Condensed',Impact,sans-serif;--body:'Plus Jakarta Sans',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f3f1ee;color:var(--ink);font-family:var(--body);font-size:14px}button{font:inherit;cursor:pointer}img,video{display:block}#app{min-height:100dvh;background:var(--paper);padding-top:12px}
.hero{height:196px;position:relative;overflow:hidden;background:#171717;color:white}.hero video,.hero>img{width:100%;height:100%;object-fit:cover;filter:brightness(.42)}.hero-copy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:4px;padding:12px}.hero-logo{width:50px;height:50px;object-fit:contain}.hero-copy h1{margin:3px 0 0;font:800 39px/1 var(--title);letter-spacing:.08em}.hero-copy p{margin:0;color:#f0c4ae;font-size:11px;letter-spacing:.13em;font-weight:700}.hero-copy small{font-size:10px;color:#eee}
.category-wrap{position:relative;background:#fff;padding:16px 0 12px;border-bottom:1px solid #f0f0f0}.category-scroller{overflow-x:auto;overflow-y:hidden;padding:0 40px 2px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}.category-scroller::-webkit-scrollbar{display:none}.category-scroller{scrollbar-width:none}.category-nav{display:flex;gap:14px;width:max-content;min-width:100%}.category-link{border:0;background:transparent;text-align:center;min-width:72px;max-width:72px;padding:0;color:#171717;text-decoration:none;scroll-snap-align:start;flex:0 0 auto}.category-icon{width:66px;height:66px;border-radius:50%;background:#f8f8f8;box-shadow:0 3px 5px #0002;border:2px solid white;margin:0 auto 9px;overflow:hidden;display:grid;place-items:center}.category-icon img{width:100%;height:100%;object-fit:cover}.category-link strong{font:800 15px/1 var(--title);letter-spacing:.02em;display:block}.category-link:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:9px}.category-next{position:absolute;right:10px;top:18px;width:28px;height:28px;border-radius:999px;border:0;background:#fff;box-shadow:0 3px 10px #00000018;color:var(--brand);display:grid;place-items:center;z-index:2}.category-next svg{width:16px;height:16px}
.menu-content{padding:4px 15px 85px}.section{scroll-margin-top:15px;padding-top:16px}.section h2{font:700 31px/1 var(--title);letter-spacing:.01em;margin:14px 0 12px}.sub-heading{font:700 23px/1 var(--title);margin:23px 0 8px}.product{display:grid;grid-template-columns:104px minmax(0,1fr);min-height:106px;width:100%;padding:0;align-items:stretch;text-align:left;border:1px solid #e4e4e4;border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 3px 3px #00000017;margin-bottom:12px;color:inherit}.product-image{height:100%;min-height:106px;width:104px;object-fit:cover;background:#eee}.product-content{padding:11px 12px 10px;min-width:0;display:flex;flex-direction:column;gap:5px}.product-name{font:700 19px/1.06 var(--title);text-transform:uppercase}.product-desc{font-size:11px;line-height:1.42;color:#6b6b6b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}.product-price{font:800 19px/1 var(--title);color:var(--brand);white-space:nowrap}.product-more{display:flex;align-items:center;gap:2px;font-size:11px;color:#777}.product:active{transform:scale(.994)}.product:focus-visible{outline:3px solid #c35a38;outline-offset:2px}
.drink-group{margin-bottom:20px}.drink{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}.drink span:last-child{color:var(--brand);font-weight:700;white-space:nowrap}.drink-group h3{font:700 22px var(--title);margin:13px 0 0}.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:12;background:#fff;box-shadow:0 -3px 12px #00000015;border-top:1px solid #eee;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center}.home-btn{border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 13px var(--title)}.home-btn svg{width:20px;height:20px}
.detail-screen{position:fixed;z-index:25;inset:0;background:#fff;transform:translateX(102%);transition:transform .23s cubic-bezier(.22,.8,.22,1);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}.detail-screen.active{transform:translateX(0);visibility:visible}.detail-screen.closing{visibility:visible;transform:translateX(102%)}.detail-top{height:64px;display:flex;align-items:center;padding:0 17px;border-bottom:1px solid #f1f1f1}.back{border:0;background:#f0f2f3;border-radius:50%;height:38px;width:38px;display:grid;place-items:center}.back svg{width:21px;height:21px}.detail-img{width:100%;height:min(54vw,280px);min-height:205px;object-fit:contain;background:#eee}.detail-body{padding:25px 20px 105px;max-width:690px;margin:auto}.detail-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.detail-heading h2{font:800 33px/1.03 var(--title);margin:0}.detail-price{font:800 26px/1.1 var(--title);color:var(--brand);white-space:nowrap}.detail-copy{line-height:1.75;color:#5e5e5e;font-size:14px;margin:0 0 20px}.detail-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:22px 0}.fact{background:#f7f7f7;border:1px solid #eee;border-radius:10px;padding:13px 11px}.fact strong,.options strong{display:block;font:700 17px var(--title);margin-bottom:6px}.fact p,.options p{margin:0;font-size:12px;line-height:1.6;color:#666}.options{background:#f7f7f7;border:1px solid #eee;border-radius:10px;padding:13px;margin:12px 0}.detail-back-bottom{margin-top:35px;border:0;background:transparent;padding:10px 0;display:flex;align-items:center;gap:7px;font:700 17px var(--title)}.detail-back-bottom svg{width:18px}.detail-note{color:#888;font-size:11px;line-height:1.6}.no-scroll{overflow:hidden}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:680px){#app{max-width:460px;margin:auto;box-shadow:0 0 22px #00000016}.detail-screen{left:50%;right:auto;width:min(100%,460px);transform:translateX(calc(-50% + 460px))}.detail-screen.active{transform:translateX(-50%)}.detail-screen.closing{transform:translateX(calc(-50% + 460px))}.bottom-bar{left:50%;right:auto;width:min(100%,460px);transform:translateX(-50%)}}
@media(max-width:350px){.product{grid-template-columns:90px minmax(0,1fr)}.product-image{width:90px}.product-name{font-size:17px}.category-link strong{font-size:13px}.category-icon{width:56px;height:56px}.category-link{min-width:64px;max-width:64px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.detail-screen,.category-scroller{transition:none;scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app">
<header class="hero" id="top"><video autoplay muted loop playsinline poster="../images/menu_rind_tantuni.jpg"><source src="../videos/acilis_video.mp4" type="video/mp4"></video><div class="hero-copy"><img class="hero-logo" src="../images/RW_Logo.png" alt="ROLLWERK"><h1>ROLLWERK</h1><p>FRISCH · BUNT · ECHT</p><small>Unsere Speisekarte · Frauenplan 9, Weimar</small></div></header>
<div class="category-wrap"><button class="category-next" id="categories-next" type="button" aria-label="Weitere Kategorien anzeigen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button><div class="category-scroller" id="category-scroller"><nav class="category-nav" aria-label="Speisekartenkategorien" id="categories"></nav></div></div>
<main class="menu-content" id="menu"><p>Speisekarte wird geladen …</p></main>
<footer class="bottom-bar"><button class="home-btn" id="go-top" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3-10 9h3v9h6v-6h2v6h6v-9h3z"/></svg>Startseite</button></footer>
</div>
<section class="detail-screen" id="detail" aria-label="Produktdetails" aria-hidden="true" tabindex="-1"><div class="detail-top"><button class="back" type="button" id="back" aria-label="Zurück zur Speisekarte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18 9 12l6-6M9 12h12"/></svg></button></div><img id="detail-image" class="detail-img" src="" alt=""><div class="detail-body"><div class="detail-heading"><h2 id="detail-name"></h2><div class="detail-price" id="detail-price"></div></div><p id="detail-desc" class="detail-copy"></p><div class="detail-facts"><div class="fact"><strong>Kalorien</strong><p id="detail-calories"></p></div><div class="fact"><strong>Allergene</strong><p id="detail-allergens"></p></div></div><div class="options" id="options-wrap"><strong>Auswahl & Hinweise</strong><p id="detail-options"></p></div><p class="detail-note">Kalorien sind ungefähre Werte. Für Fragen zu Allergenen bitte unser Team ansprechen.</p><button type="button" id="back-bottom" class="detail-back-bottom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18 9 12l6-6M9 12h12"/></svg>Zurück</button></div></section>
<script src="../menu-data.js"></script>
<script>
(()=>{
const data=window.ROLLWERK_MENU,menu=document.getElementById('menu'),categories=document.getElementById('categories'),detail=document.getElementById('detail');
if(!data){menu.textContent='Speisekarte konnte nicht geladen werden.';return;}
const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
const categoryDefs=[
  {label:'ROLLI',id:'rolli',img:'images/menu_rind_tantuni.jpg',pos:'50% 58%'},
  {label:'FALLI',id:'falafel',img:'images/menu_falafelteller_6.1.png',pos:'50% 51%'},
  {label:'SALATE',id:'salate',img:'images/menu_gemischter_salat.jpg',pos:'50% 56%'},
  {label:'DESSERTS',id:'desserts',img:'images/menu_magnolia_erdbeer.jpg',pos:'50% 52%'},
  {label:'GETRÄNKE',id:'getraenke',img:'images/menu_getraenke.jpg',pos:'50% 50%',fallback:'images/menu_pommes.jpg'},
  {label:'BEILAGEN & DIPS',id:'extras',img:'images/menu_dip_avocado.jpg',pos:'50% 50%'}
];
for(const category of categoryDefs){const a=el('a','category-link');a.href='#'+category.id;const icon=el('span','category-icon');const img=el('img');img.src='../'+category.img;img.alt='';img.style.objectPosition=category.pos||'50% 50%';if(category.fallback){img.addEventListener('error',()=>{img.src='../'+category.fallback;});}icon.appendChild(img);a.appendChild(icon);a.appendChild(el('strong','',category.label));categories.appendChild(a)}
const scroller=document.getElementById('category-scroller');document.getElementById('categories-next').addEventListener('click',()=>scroller.scrollBy({left:220,behavior:'smooth'}));
menu.replaceChildren();
const titles={rolli:'ROLLI',falafel:'FALLI',salate:'SALATE',desserts:'DESSERTS',getraenke:'GETRÄNKE',extras:'BEILAGEN & DIPS'};
function section(id,title){const s=el('section','section');s.id=id;s.appendChild(el('h2','',title));menu.appendChild(s);return s;}
function shortName(item){return item.name.replace(/^FALAFELTELLER\s*(\d+)\s*[–-]\s*/i,'FALLI $1 – ').replace(/\s*\((WÜRZIG|KRÄUTERFRISCH|PIKANT)\)\s*\(6 STÜCK\)/i,' (6 STÜCK)');}
function shopPrice(price){const m=(price||'').match(/Im Laden:\s*€\s*([\d,.]+)/i);return m?m[1]+' €':(price||'');}
let previousFocus=null, detailOpen=false;
const back=document.getElementById('back'), backBottom=document.getElementById('back-bottom');
function openItem(item,trigger){previousFocus=trigger;document.getElementById('detail-image').src='../'+item.image;document.getElementById('detail-image').alt=item.name;document.getElementById('detail-name').textContent=shortName(item);document.getElementById('detail-price').textContent=shopPrice(item.price);document.getElementById('detail-desc').textContent=item.description||'';document.getElementById('detail-calories').textContent=item.calories||'Auf Anfrage';document.getElementById('detail-allergens').textContent=item.allergens||'Auf Anfrage';const opt=document.getElementById('options-wrap');opt.hidden=!item.options;document.getElementById('detail-options').textContent=item.options||'';detail.classList.remove('closing');detail.classList.add('active');detail.setAttribute('aria-hidden','false');document.body.classList.add('no-scroll');detail.scrollTop=0;detailOpen=true;history.pushState({rollwerkDetail:item.id},'',location.pathname+location.search+'#'+encodeURIComponent(item.id));back.focus({preventScroll:true});}
function closeUI(){if(!detailOpen)return;detailOpen=false;detail.classList.remove('active');detail.classList.add('closing');detail.setAttribute('aria-hidden','true');document.body.classList.remove('no-scroll');const focusTarget=previousFocus;setTimeout(()=>{detail.classList.remove('closing');if(focusTarget&&focusTarget.isConnected)focusTarget.focus({preventScroll:true})},250)}
function closeDetail(){if(!detailOpen)return;if(history.state&&history.state.rollwerkDetail)history.back();else closeUI()}
// Detay ekranında soldan sağa kaydırma ile geri dönüş.
// Dikey kaydırmayı engellemez; yanlışlıkla açılan hareketleri eler.
let startX=0,startY=0,swipeTracking=false;
detail.addEventListener('touchstart',e=>{
  if(!detailOpen||e.touches.length!==1){swipeTracking=false;return;}
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
  swipeTracking=true;
},{passive:true});
detail.addEventListener('touchend',e=>{
  if(!swipeTracking||!detailOpen||!e.changedTouches.length)return;
  swipeTracking=false;
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;
  if(dx>85&&Math.abs(dx)>Math.abs(dy)*1.45)closeDetail();
},{passive:true});
detail.addEventListener('touchcancel',()=>{swipeTracking=false;},{passive:true});
back.addEventListener('click',closeDetail);backBottom.addEventListener('click',closeDetail);window.addEventListener('popstate',()=>{if(detailOpen)closeUI()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailOpen)closeDetail()});
function addItem(root,item){const btn=el('button','product');btn.type='button';btn.setAttribute('aria-label',shortName(item)+' – Details anzeigen');const img=el('img','product-image');img.src='../'+item.image;img.alt='';img.loading='lazy';btn.appendChild(img);const content=el('span','product-content');content.appendChild(el('span','product-name',shortName(item)));const description=(item.description||'').replace(/^In Filoteig oder Brot\.\s*/i,'');if(description)content.appendChild(el('span','product-desc',description));const bottom=el('span','product-bottom');bottom.appendChild(el('span','product-price',shopPrice(item.price)));bottom.appendChild(el('span','product-more','Details ›'));content.appendChild(bottom);btn.appendChild(content);btn.addEventListener('click',()=>openItem(item,btn));root.appendChild(btn)}
for(const cat of ['rolli','falafel','salate','desserts']){const s=section(cat,titles[cat]);data.items.filter(x=>x.category===cat).forEach(i=>addItem(s,i));}
const drinksSection=section('getraenke',titles.getraenke);for(let index=0;index<data.drinkCategories.length;index++){const group=el('div','drink-group');group.appendChild(el('h3','',data.drinkCategories[index]));for(const d of data.drinks.filter(x=>x.category===index)){const row=el('div','drink');row.appendChild(el('span','',d.name));row.appendChild(el('span','',d.price));group.appendChild(row)}drinksSection.appendChild(group)}
const extras=section('extras',titles.extras);for(const id of ['beilagen','saucen']){const items=data.items.filter(i=>i.category===id);if(!items.length)continue;const label=(data.categories.find(c=>c.id===id)||{}).name||id;extras.appendChild(el('h3','sub-heading',label));items.forEach(i=>addItem(extras,i));}
document.getElementById('go-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
})();
</script>
</body>
</html>
